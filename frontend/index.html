<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta
      name="description"
      content="Track income, expenses, budgets and cash flow in one secure personal finance dashboard."
    />
    <title>Expense Tracker</title>

    <!--
      Apply the saved theme BEFORE the first paint so dark mode never flashes
      white. See Section 9.1 step 3 of the master prompt.
      localStorage 'theme': 'light' | 'dark' | absent = follow the OS.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage blocked - fall back to light mode */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
